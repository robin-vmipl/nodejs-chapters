<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Home to Airbnb</title>
  </head>
  <body>
    <header><h1>Add Home to Airbnb</h1></header>
    <main>
      <form action="/host/add-home" method="POST">
        <label for="homeName">Home Name:</label>
        <input type="text" id="homeName" name="homeName" required />
        <br />
        <label for="homeLocation">Home Location:</label>
        <input type="text" id="homeLocation" name="homeLocation" required />
        <br />
        <button type="submit">Add Home</button>
      </form>
    </main>
  </body>
</html>
